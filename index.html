<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti 🌻</title>
  <style>
    body {
      background-color: #fffde7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #f57f17; margin-bottom: 5px; }
    p { color: #fbc02d; font-weight: bold; font-size: 1.1rem; }
    #jardin {
      width: 100%;
      max-width: 500px;
      height: 350px;
      background: linear-gradient(to bottom, #e8f5e9, #c8e6c9);
      border: 3px dashed #fbc02d;
      border-radius: 15px;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .flor {
      position: absolute;
      font-size: 2.5rem;
      animation: aparecer 0.4s ease-out;
      user-select: none;
    }
    @keyframes aparecer {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    #mensaje-final {
      display: none;
      background: #fff8e1;
      border: 2px solid #fbc02d;
      padding: 15px;
      border-radius: 10px;
      max-width: 450px;
      margin: 20px auto;
      color: #e65100;
    }
    .contador {
      font-size: 1.2rem;
      color: #f57f17;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>¡Feliz Día de las Flores Amarillas! 💛</h1>
  <p>Toca dentro del jardín para plantar 5 flores amarillas</p>
  
  <div class="contador">Flores plantadas: <span id="num">0</span>/5</div>
  <div id="jardin"></div>

  <div id="mensaje-final">
    <h2>✨ ¡Un ramo solo para ti! ✨</h2>
    <p>Que tu día esté lleno de luz, sonrisa y mucho color. Te quiero muchísimo. 🌻✨</p>
  </div>

  <script>
    const jardin = document.getElementById('jardin');
    const contador = document.getElementById('num');
    const mensajeFinal = document.getElementById('mensaje-final');
    
    const floresEmojis = ['🌻', '🌼', '💛', '✨'];
    let cantidad = 0;
    const maxFlores = 5;

    jardin.addEventListener('click', (e) => {
      if (cantidad >= maxFlores) return;

      const rect = jardin.getBoundingClientRect();
      const x = e.clientX - rect.left - 20;
      const y = e.clientY - rect.top - 20;

      const nuevaFlor = document.createElement('div');
      nuevaFlor.className = 'flor';
      
      // Selecciona un emoji al azar
      const emojiAzar = floresEmojis[Math.floor(Math.random() * floresEmojis.length)];
      nuevaFlor.innerText = emojiAzar;
      
      nuevaFlor.style.left = `${x}px`;
      nuevaFlor.style.top = `${y}px`;

      jardin.appendChild(nuevaFlor);
      
      cantidad++;
      contador.innerText = cantidad;

      if (cantidad === maxFlores) {
        setTimeout(() => {
          mensajeFinal.style.display = 'block';
        }, 300);
      }
    });
  </script>

</body>
</html>
